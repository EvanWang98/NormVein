[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normvein"
version = "0.1.0"
description = "Large-scale synthetic pretraining for finger-vein detection, segmentation, and recognition"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
  {name = "Yifan Wang"},
  {name = "NormVein authors"},
]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9",
]

[project.scripts]
normvein = "normvein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
